
{{- $codigo := .Get 0 | default "es" -}}
{{- $etiqueta := .Get 1 | default $codigo -}}
<section class="idioma" id="idioma-{{ $codigo }}" data-idioma="{{ $codigo }}" data-etiqueta="{{ $etiqueta }}" lang="{{ $codigo }}">
<h2 class="idioma__titulo">{{ $etiqueta }}</h2>
{{ .Inner | markdownify }}
</section>
