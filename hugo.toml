baseURL = "/"
relativeURLs = true
canonifyURLs = false

locale = "en-GB"
title = "OSINT Investigations"
theme = "solite"

enableRobotsTXT = true
[build]
  writeStats = false

[pagination]
  pagerSize = 10

[params]
  description = "Citizen log of harassment incidents in Saint Petersburg, Russia."
  author = "OSINT SPb"
  url = ""

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
