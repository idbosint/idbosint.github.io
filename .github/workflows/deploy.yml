name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El tema Solite compila SCSS con postCSS: necesita Node y npm ci.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # Hugo EXTENDED (obligatorio para `css.Sass` / `toCSS` del tema).
      # Versión fijada para que el resultado sea reproducible.
      - name: Setup Hugo
        run: |
          curl -fsSL -o hugo.tgz \
            https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_extended_0.169.0_linux-amd64.tar.gz
          sudo tar -xzf hugo.tgz -C /usr/local/bin hugo
          rm -f hugo.tgz
          hugo version

      - name: Configure Pages
        uses: actions/configure-pages@v6
        id: pages

      # IMPORTANTE: se compila con baseURL "/" (el de hugo.toml).
      # Con relativeURLs + un baseURL que lleva subcarpeta, Hugo duplica el
      # prefijo en los recursos (./idbosint/js/site.css). Con "/" los enlaces
      # salen relativos y funcionan en /repo/, en la raíz y en un .i2p.
      - name: Build with Hugo
        run: hugo --minify --gc

      # El sitemap y el RSS sí necesitan URLs absolutas: con baseURL "/" salen
      # como "/posts/…", que en un project site apuntaría a la raíz del dominio.
      - name: Absolutizar sitemap y RSS
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          sed -i "s|<loc>/|<loc>${BASE}/|g" public/sitemap.xml
          [ -f public/index.xml ] && sed -i "s|<link>/|<link>${BASE}/|g; s|href=\"/index.xml\"|href=\"${BASE}/index.xml\"|g" public/index.xml
          grep -o '<loc>[^<]*' public/sitemap.xml | head -3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
